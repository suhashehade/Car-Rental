<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Renter - Rental System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col font-sans">

<!-- Navigation Bar -->
<nav class="bg-indigo-600 text-white shadow-lg sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16 items-center">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="showSection('carsSection')">
                <i class="fa-solid font-bold text-2xl text-amber-400 fa-car-side"></i>
                <span class="font-bold text-xl tracking-wide">Car Renter</span>
            </div>

            <div id="navGuest" class="flex space-x-2">
                <button onclick="showSection('loginSection')" class="px-4 py-2 text-sm font-medium hover:bg-indigo-700 rounded-lg transition">Login</button>
                <button onclick="showSection('registerSection')" class="px-4 py-2 text-sm font-medium bg-amber-500 hover:bg-amber-600 text-indigo-950 rounded-lg font-bold transition">Register</button>
            </div>

            <div id="navUser" class="hidden flex items-center space-x-4">
                <button onclick="showSection('carsSection')" class="hover:text-amber-300 font-medium text-sm flex items-center gap-1">
                    <i class="fa-solid fa-car"></i> Cars
                </button>
                <button onclick="showSection('reservationsSection')" class="hover:text-amber-300 font-medium text-sm flex items-center gap-1">
                    <i class="fa-solid fa-calendar-check"></i> My Reservations
                </button>
                <button onclick="showSection('profileSection')" class="hover:text-amber-300 font-medium text-sm flex items-center gap-1">
                    <i class="fa-solid fa-user-circle"></i> Profile
                </button>
                <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1.5 rounded-lg text-sm transition ml-2">
                    Logout <i class="fa-solid fa-right-from-bracket ml-1"></i>
                </button>
            </div>
        </div>
    </div>
</nav>

<!-- Global Alert Box -->
<div class="max-w-7xl mx-auto px-4 mt-4 w-full">
    <div id="alertBox" class="hidden p-4 rounded-lg text-sm font-medium shadow-sm transition-all duration-300"></div>
</div>

<!-- Main Content Area -->
<main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">

    <!-- 1. LOGIN SECTION -->
    <section id="loginSection" class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-xl border border-gray-100">
        <h2 class="text-2xl font-bold text-center text-indigo-900 mb-6">Welcome Back</h2>
        <form onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                <input type="email" id="loginEmail" required class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="loginPassword" required class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl font-bold transition">Sign In</button>
        </form>
    </section>

    <!-- 2. REGISTER SECTION -->
    <section id="registerSection" class="hidden max-w-lg mx-auto bg-white p-8 rounded-2xl shadow-xl border border-gray-100">
        <h2 class="text-2xl font-bold text-center text-indigo-900 mb-6">Create New Account</h2>
        <form onsubmit="handleRegister(event)" class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">First Name</label>
                    <input type="text" id="regFirstName" required class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Last Name</label>
                    <input type="text" id="regLastName" required class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                <input type="email" id="regEmail" required class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>
            <!-- Password Field -->
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Password</label>
                <input type="password" id="regPassword" required class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <!-- Confirm Password Field -->
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Confirm Password</label>
                <input type="password" id="regConfirmPassword" required class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
                <input type="text" id="regPhone" class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Driver License Number</label>
                <input type="text" id="regDriverLicense" class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <div class="border-t pt-3 mt-3">
                <p class="text-xs font-semibold text-gray-500 mb-2">Address Information</p>
                <div class="grid grid-cols-2 gap-3">
                    <input type="text" id="regCity" placeholder="City" required class="px-3 py-1.5 text-sm border rounded-lg">
                    <input type="text" id="regCountry" placeholder="Country" required class="px-3 py-1.5 text-sm border rounded-lg">
                    <input type="text" id="regAddress1" placeholder="Address Line 1" required class="col-span-2 px-3 py-1.5 text-sm border rounded-lg">
                </div>
            </div>

            <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-indigo-950 py-2.5 rounded-xl font-bold transition">Register Account</button>
        </form>
    </section>
    <!-- Search & Filter Controls -->
  
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-8">
        <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-6 gap-3">

            <!-- Search Input -->
            <div class="lg:col-span-1">
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Search Car</label>
                <input type="text" id="filterSearch" placeholder="Brand or model..."
                       class="w-full px-3 py-2 rounded-xl border border-gray-200 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <!-- Start Date -->
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Start Date</label>
                <input type="datetime-local" id="filterStartDate"
                       class="w-full px-3 py-2 rounded-xl border border-gray-200 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <!-- End Date -->
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">End Date</label>
                <input type="datetime-local" id="filterEndDate"
                       class="w-full px-3 py-2 rounded-xl border border-gray-200 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <!-- Max Price -->
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Max Price / Hr ($)</label>
                <input type="number" id="filterMaxPrice" placeholder="e.g. 50" min="0"
                       class="w-full px-3 py-2 rounded-xl border border-gray-200 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <!-- Color -->
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Color</label>
                <input type="text" id="filterColor" placeholder="e.g. Red"
                       class="w-full px-3 py-2 rounded-xl border border-gray-200 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <!-- Actions Buttons -->
            <div class="flex items-end gap-2">
                <button onclick="handleSearchCars()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold py-2 px-3 rounded-xl transition shadow-sm">
                    <i class="fa-solid fa-filter mr-1"></i> Filter
                </button>
                <button onclick="resetCarFilters()" class="bg-gray-100 hover:bg-gray-200 text-gray-600 text-sm font-bold py-2 px-3 rounded-xl transition">
                    <i class="fa-solid fa-rotate-left"></i>
                </button>
            </div>

        </div>
    </div>
    <!-- 3. CARS LIST SECTION -->
    <section id="carsSection" class="hidden">
        <h2 class="text-2xl font-bold text-indigo-900 mb-6 flex items-center gap-2">
            <i class="fa-solid fa-car text-indigo-600"></i> Available Cars for Rent
        </h2>
        <div id="carsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Cars inserted here dynamically -->
        </div>
    </section>

    <!-- 4. MY RESERVATIONS SECTION -->
    <section id="reservationsSection" class="hidden">
        <h2 class="text-2xl font-bold text-indigo-900 mb-6 flex items-center gap-2">
            <i class="fa-solid fa-calendar-check text-indigo-600"></i> My Reservations
        </h2>
        <div id="reservationsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Reservations inserted here dynamically -->
        </div>
    </section>

    <!-- 5. PROFILE SECTION -->
    <section id="profileSection" class="hidden max-w-xl mx-auto bg-white p-8 rounded-2xl shadow-xl border border-gray-100">
        <h2 class="text-2xl font-bold text-indigo-900 mb-6">User Profile</h2>
        <form onsubmit="handleUpdateProfile(event)" class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">First Name</label>
                    <input type="text" id="profFirstName" required class="w-full px-3 py-2 border rounded-xl">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Last Name</label>
                    <input type="text" id="profLastName" required class="w-full px-3 py-2 border rounded-xl">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
                <input type="text" id="profPhone" class="w-full px-3 py-2 border rounded-xl">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl font-bold transition">Update Profile</button>
        </form>
    </section>

</main>

<!-- Create Reservation Modal -->
<div id="bookingModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
        <h3 class="text-xl font-bold text-indigo-900" id="modalCarTitle">Book a Car</h3>
        <form onsubmit="handleCreateReservation(event)" class="space-y-4">
            <input type="hidden" id="modalCarId">
            <div>
                <label class="block text-sm font-medium mb-1">Pickup Location</label>
                <input type="text" id="resLocation" value="Main Branch" required class="w-full border p-2 rounded-xl">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Start Date & Time</label>
                <input type="datetime-local" id="resStart" required class="w-full border p-2 rounded-xl">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">End Date & Time</label>
                <input type="datetime-local" id="resEnd" required class="w-full border p-2 rounded-xl">
            </div>
            <div class="flex justify-end space-x-2 pt-2">
                <button type="button" onclick="closeModal('bookingModal')" class="px-4 py-2 border rounded-xl hover:bg-gray-100">Cancel</button>
                <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700">Confirm Booking</button>
            </div>
        </form>
    </div>
</div>

<!-- Edit Reservation Modal -->
<div id="editReservationModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
        <h3 class="text-xl font-bold text-indigo-900">Update Reservation Dates</h3>
        <form onsubmit="handleUpdateReservation(event)" class="space-y-4">
            <input type="hidden" id="editResId">
            <div>
                <label class="block text-sm font-medium mb-1">Location</label>
                <input type="text" id="editResLocation" required class="w-full border p-2 rounded-xl">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Start Date & Time</label>
                <input type="datetime-local" id="editResStart" required class="w-full border p-2 rounded-xl">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">End Date & Time</label>
                <input type="datetime-local" id="editResEnd" required class="w-full border p-2 rounded-xl">
            </div>
            <div class="flex justify-end space-x-2 pt-2">
                <button type="button" onclick="closeModal('editReservationModal')" class="px-4 py-2 border rounded-xl hover:bg-gray-100">Cancel</button>
                <button type="submit" class="px-4 py-2 bg-amber-500 text-indigo-950 font-bold rounded-xl hover:bg-amber-600">Save Changes</button>
            </div>
        </form>
    </div>
</div>

<!-- JavaScript Logic -->
<script>
    const API_URL = "/api";

    window.onload = () => {
        const token = localStorage.getItem("jwt_token");
        if (token) {
            updateNavState(true);
            showSection('carsSection');
        } else {
            updateNavState(false);
            showSection('loginSection');
        }
    };

    function showAlert(msg, isSuccess = true) {
        const box = document.getElementById('alertBox');
        box.className = `p-4 rounded-lg text-sm font-medium shadow-sm transition-all duration-300 ${
            isSuccess ? 'bg-green-100 text-green-800 border border-green-200' : 'bg-red-100 text-red-800 border border-red-200'
        }`;
        box.innerText = msg;
        box.classList.remove('hidden');
        setTimeout(() => box.classList.add('hidden'), 4000);
    }

    function updateNavState(isLoggedIn) {
        document.getElementById('navGuest').classList.toggle('hidden', isLoggedIn);
        document.getElementById('navUser').classList.toggle('hidden', !isLoggedIn);
    }

    function showSection(id) {
        ['loginSection', 'registerSection', 'carsSection', 'reservationsSection', 'profileSection'].forEach(s => {
            document.getElementById(s).classList.add('hidden');
        });
        document.getElementById(id).classList.remove('hidden');

        if (id === 'carsSection') loadCars();
        if (id === 'reservationsSection') loadReservations();
        if (id === 'profileSection') loadProfile();
    }

    function closeModal(modalId) {
        document.getElementById(modalId).classList.add('hidden');
    }

    // --- AUTH LOGIC ---
    async function handleLogin(e) {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;

        try {
            const res = await fetch(`${API_URL}/users/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            if (res.ok) {
                localStorage.setItem('jwt_token', data.token);
                updateNavState(true);
                showSection('carsSection');
                showAlert('Logged in successfully!');
            } else {
                showAlert(data.message || 'Invalid credentials', false);
            }
        } catch (err) { showAlert('Server connection failed', false); }
    }

    async function handleRegister(e) {
        e.preventDefault();
        const body = {
            firstName: document.getElementById('regFirstName').value,
            lastName: document.getElementById('regLastName').value,
            email: document.getElementById('regEmail').value,
            password: document.getElementById('regPassword').value,
            confirmPassword: document.getElementById('regConfirmPassword').value,
            phoneNumber: document.getElementById('regPhone').value,
            driverLicenseNumber: document.getElementById('regDriverLicense').value,
            address: {
                city: document.getElementById('regCity').value,
                country: document.getElementById('regCountry').value,
                addressLine1: document.getElementById('regAddress1').value,
                addressLine2: ""
            }
        };

        try {
            const res = await fetch(`${API_URL}/users/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if (res.ok) {
                showAlert('Account created successfully! You can now log in.');
                showSection('loginSection');
            } else {
                const data = await res.json();
                showAlert(data.errors ? Object.values(data.errors).flat().join(', ') : 'Registration failed', false);
            }
        } catch (err) { showAlert('An error occurred connecting to the server', false); }
    }

    // --- CARS LOGIC ---
    async function loadCars() {
        try {
            const token = localStorage.getItem('jwt_token');
            const res = await fetch(`${API_URL}/cars/available`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            let data = await res.json();
            const cars = Array.isArray(data) ? data : (data.data || data.cars || []);
            const grid = document.getElementById('carsGrid');

            if (!cars.length) {
                grid.innerHTML = `<p class="text-gray-500 col-span-3 text-center">No cars available at the moment.</p>`;
                return;
            }

            grid.innerHTML = cars.map(c => {
                const brandName = c.brand || c.Brand || c.make || c.Make || 'Car';
                const modelName = c.model || c.Model || '';
                const price = c.hourlyPrice || c.HourlyPrice || c.rentalRate || 0;
                const carId = c.id || c.Id;

                return `
                        <div class="bg-white rounded-2xl shadow-md p-6 border border-gray-100 flex flex-col justify-between hover:shadow-xl transition">
                            <div>
                                <div class="flex justify-between items-start mb-3">
                                    <h3 class="text-xl font-bold text-gray-900">${brandName} ${modelName}</h3>
                                </div>
                                <p class="text-2xl font-extrabold text-amber-500 mb-4">$${price} <span class="text-xs text-gray-400 font-normal">/ hour</span></p>
                            </div>
                            <button onclick="openBookingModal('${carId}', '${brandName} ${modelName}')" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl transition">
                                Book Car Now
                            </button>
                        </div>
                    `;
            }).join('');
        } catch (err) { console.error("Error loading cars:", err); }
    }

    function openBookingModal(carId, carName) {
        document.getElementById('modalCarId').value = carId;
        document.getElementById('modalCarTitle').innerText = `Book Car: ${carName}`;
        document.getElementById('bookingModal').classList.remove('hidden');
    }

    async function handleCreateReservation(e) {
        e.preventDefault();
        const token = localStorage.getItem('jwt_token');

        const carIdVal = document.getElementById('modalCarId').value;
        const startVal = document.getElementById('resStart').value;
        const endVal = document.getElementById('resEnd').value;
        const locVal = document.getElementById('resLocation').value;

        const body = {
            carId: carIdVal,
            startDate: new Date(startVal).toISOString(),
            endDate: new Date(endVal).toISOString(),
            location: locVal,
            preferenceIds: []
        };

        try {
            const res = await fetch(`${API_URL}/reservations`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(body)
            });

            if (res.ok) {
                showAlert('Reservation created successfully!');
                closeModal('bookingModal');
                showSection('reservationsSection');
            } else {
                let errorMsg = 'Failed to create reservation';
                try {
                    const errData = await res.json();
                    errorMsg = errData.errors ? Object.values(errData.errors).flat().join(' | ') : (errData.message || errorMsg);
                } catch (_) {}
                showAlert(errorMsg, false);
            }
        } catch (err) { showAlert('An error occurred connecting to the server', false); }
    }

    // --- RESERVATIONS MANAGEMENT LOGIC ---
    async function loadReservations() {
        try {
            const token = localStorage.getItem('jwt_token');
            const res = await fetch(`${API_URL}/reservations/user-reservations`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (!res.ok) {
                console.error("Failed to fetch reservations:", res.status);
                showAlert('Failed to load your reservations', false);
                return;
            }

            let data = await res.json();
            const reservations = Array.isArray(data) ? data : (data.data || data.items || data.reservations || []);
            const grid = document.getElementById('reservationsGrid');

            if (!reservations || !reservations.length) {
                grid.innerHTML = `<p class="text-gray-500 col-span-2 text-center py-8">You have no active reservations.</p>`;
                return;
            }

            grid.innerHTML = reservations.map(r => {
                const resId = r.reservationId || r.ReservationId || r.id || r.Id;
                const carName = r.car ? `${r.car.brand || r.car.make || ''} ${r.car.model || ''}`.trim() : (r.carName || 'Reserved Vehicle');
                const location = r.location || r.Location || r.pickupLocation || 'Main Branch';

                const startDate = new Date(r.startDate || r.startTime).toLocaleString();
                const endDate = new Date(r.endDate || r.endTime).toLocaleString();
                
                const totalPrice = r.totalPrice ?? r.TotalPrice ?? 0;
                const formattedPrice = typeof totalPrice === 'number' ? totalPrice.toFixed(2) : totalPrice;

                const safeLocation = String(location).replace(/'/g, "\\'");

                return `
                <div class="bg-white rounded-2xl shadow-md p-6 border border-gray-100 flex flex-col justify-between hover:shadow-lg transition">
                    <div class="space-y-3">
                        <div class="flex justify-between items-center border-b pb-3">
                            <h3 class="text-lg font-bold text-indigo-900">${carName}</h3>
                            <span class="bg-green-100 text-green-800 text-xs px-2.5 py-1 rounded-full font-bold">Active</span>
                        </div>
                        <div class="text-sm space-y-2 text-gray-600">
                            <p><i class="fa-solid fa-location-dot text-indigo-500 w-5"></i> <strong>Location:</strong> ${location}</p>
                            <p><i class="fa-solid fa-clock text-indigo-500 w-5"></i> <strong>Start:</strong> ${startDate}</p>
                            <p><i class="fa-solid fa-clock-rotate-left text-indigo-500 w-5"></i> <strong>End:</strong> ${endDate}</p>
                            <div class="pt-2 border-t border-dashed border-gray-200 flex justify-between items-center">
                                <span class="text-gray-500 font-medium"><i class="fa-solid fa-receipt text-indigo-500 w-5"></i> Total Price:</span>
                                <span class="text-base font-extrabold text-indigo-900">$${formattedPrice}</span>
                            </div>
                        </div>
                    </div>

                    <div class="flex gap-3 mt-6 pt-3 border-t">
                        <button onclick="openEditReservationModal('${resId}', '${safeLocation}')" class="flex-1 bg-amber-500 hover:bg-amber-600 text-indigo-950 text-sm font-bold py-2 rounded-xl transition">
                            <i class="fa-solid fa-pen-to-square mr-1"></i> Edit Dates
                        </button>
                        <button onclick="handleCancelReservation('${resId}')" class="flex-1 bg-red-50 hover:bg-red-100 text-red-600 text-sm font-bold py-2 rounded-xl transition border border-red-200">
                            <i class="fa-solid fa-trash mr-1"></i> Cancel
                        </button>
                    </div>
                </div>
            `;
            }).join('');
        } catch (err) {
            console.error("Error loading reservations:", err);
            showAlert('Error connecting to the server', false);
        }
    }

    function openEditReservationModal(resId, location) {
        document.getElementById('editResId').value = resId;
        document.getElementById('editResLocation').value = location;
        document.getElementById('editReservationModal').classList.remove('hidden');
    }

    async function handleUpdateReservation(e) {
        e.preventDefault();
        const token = localStorage.getItem('jwt_token');
        const resId = document.getElementById('editResId').value;
        const startVal = document.getElementById('editResStart').value;
        const endVal = document.getElementById('editResEnd').value;
        const locVal = document.getElementById('editResLocation').value;

        const body = {
            startDate: new Date(startVal).toISOString(),
            endDate: new Date(endVal).toISOString(),
            location: locVal
        };

        try {
            const res = await fetch(`${API_URL}/reservations/${resId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(body)
            });

            if (res.ok) {
                showAlert('Reservation updated successfully!');
                closeModal('editReservationModal');
                loadReservations();
            } else {
                let errorMsg = 'Failed to update reservation';
                try {
                    const errData = await res.json();
                    errorMsg = errData.errors ? Object.values(errData.errors).flat().join(' | ') : (errData.message || errorMsg);
                } catch (_) {}
                showAlert(errorMsg, false);
            }
        } catch (err) { showAlert('Error connecting to the server', false); }
    }

    async function handleCancelReservation(resId) {
        if (!confirm('Are you sure you want to cancel this reservation?')) return;

        const token = localStorage.getItem('jwt_token');
        try {
            const res = await fetch(`${API_URL}/reservations/${resId}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (res.ok) {
                showAlert('Reservation cancelled successfully!');
                loadReservations();
            } else {
                showAlert('Failed to cancel reservation', false);
            }
        } catch (err) { showAlert('Error connecting to the server', false); }
    }

    // --- PROFILE LOGIC ---
    async function loadProfile() {
        const token = localStorage.getItem('jwt_token');
        try {
            const res = await fetch(`${API_URL}/users/profile`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.ok) {
                const data = await res.json();
                document.getElementById('profFirstName').value = data.firstName || '';
                document.getElementById('profLastName').value = data.lastName || '';
                document.getElementById('profPhone').value = data.phoneNumber || '';
            }
        } catch (err) { console.error(err); }
    }

    async function handleUpdateProfile(e) {
        e.preventDefault();
        const token = localStorage.getItem('jwt_token');
        const body = {
            firstName: document.getElementById('profFirstName').value,
            lastName: document.getElementById('profLastName').value,
            phoneNumber: document.getElementById('profPhone').value
        };

        try {
            const res = await fetch(`${API_URL}/users/profile`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(body)
            });
            if (res.ok) showAlert('Profile updated successfully!');
            else showAlert('Failed to update profile', false);
        } catch (err) { showAlert('Server error', false); }
    }
    async function handleSearchCars() {
        const token = localStorage.getItem('jwt_token');
        const search = document.getElementById('filterSearch').value.trim();
        const startDateVal = document.getElementById('filterStartDate')?.value;
        const endDateVal = document.getElementById('filterEndDate')?.value;
        const maxPrice = document.getElementById('filterMaxPrice').value;
        const color = document.getElementById('filterColor').value.trim();

        // التحقق من صحة التواريخ في حال أدخل المستخدم كليهما
        if (startDateVal && endDateVal && new Date(startDateVal) >= new Date(endDateVal)) {
            showAlert('End date must be after start date!', false);
            return;
        }

        // بناء Query String اعتماداً على القيم المدخلة
        const queryParams = new URLSearchParams();

        if (search) queryParams.append('brand', search);
        if (maxPrice) queryParams.append('hourlyPrice', maxPrice);
        if (color) queryParams.append('color', color);

        // تحويل التواريخ إلى ISO string لتتوافق مع الـ C# DateTime
        if (startDateVal) queryParams.append('startDate', new Date(startDateVal).toISOString());
        if (endDateVal) queryParams.append('endDate', new Date(endDateVal).toISOString());

        try {
            const res = await fetch(`${API_URL}/cars/search?${queryParams.toString()}`, {
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            });
            const data = await res.json();

            if (!res.ok) {
                const errorMsg = data.errors ? Object.values(data.errors).flat().join(', ') : (data.message || 'Failed to filter cars');
                showAlert(errorMsg, false);
                return;
            }

            const cars = data.data || data || [];
            renderCarsGrid(cars);

        } catch (err) {
            console.error("Error searching cars:", err);
            showAlert('Error connecting to the server', false);
        }
    }

  
    function resetCarFilters() {
        document.getElementById('filterSearch').value = '';
        document.getElementById('filterMaxPrice').value = '';
        document.getElementById('filterColor').value = '';
        fetchCars(); 
    }

 
    function renderCarsGrid(cars) {
        const grid = document.getElementById('carsGrid');
        if (!grid) return;

        if (!cars || !cars.length) {
            grid.innerHTML = `<p class="text-gray-500 col-span-3 text-center py-12">No cars match your search criteria.</p>`;
            return;
        }

        grid.innerHTML = cars.map(car => `
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition">
            <div class="p-6">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <h3 class="text-xl font-bold text-gray-900">${car.brand || ''} ${car.model || ''}</h3>
                        <span class="text-xs font-semibold bg-indigo-50 text-indigo-600 px-2.5 py-1 rounded-md mt-1 inline-block">
                            ${car.color || 'Standard'}
                        </span>
                    </div>
                    <div class="text-right">
                        <span class="text-2xl font-extrabold text-indigo-900">$${car.hourlyPrice || car.pricePerHour}</span>
                        <span class="text-xs text-gray-500 block">/ hour</span>
                    </div>
                </div>

                <button onclick="openBookingModal('${car.id || car.carId}')" class="w-full mt-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl transition text-sm">
                    Book Now
                </button>
            </div>
        </div>
    `).join('');
    }

    function logout() {
        localStorage.removeItem('jwt_token');
        updateNavState(false);
        showSection('loginSection');
        showAlert('Logged out successfully');
    }
</script>
